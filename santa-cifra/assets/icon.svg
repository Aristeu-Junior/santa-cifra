<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Santa Cifra">
  <defs>
    <linearGradient id="bgGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#9e2028"/>
      <stop offset="52%" stop-color="#78151b"/>
      <stop offset="100%" stop-color="#440a0e"/>
    </linearGradient>
    <radialGradient id="haloGrad" gradientUnits="userSpaceOnUse" cx="256" cy="200" r="230">
      <stop offset="0%" stop-color="#f5dc9c" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#dfb257" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#dfb257" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" gradientUnits="userSpaceOnUse" x1="120" y1="80" x2="392" y2="420">
      <stop offset="0%" stop-color="#fae4ad"/>
      <stop offset="50%" stop-color="#e2b55a"/>
      <stop offset="100%" stop-color="#b88428"/>
    </linearGradient>
    <linearGradient id="ivoryGrad" gradientUnits="userSpaceOnUse" x1="180" y1="80" x2="300" y2="400">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4ebd9"/>
    </linearGradient>
  </defs>

  <!-- Fundo Carmim Litúrgico -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>

  <!-- Resplendor central dourado -->
  <circle cx="256" cy="200" r="230" fill="url(#haloGrad)"/>

  <!-- Moldura Sacra Externa e Arco Gótico Centralizado -->
  <rect x="36" y="36" width="440" height="440" rx="84" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.42"/>
  <path d="M112 414V222c0-84 64-150 144-160 80 10 144 76 144 160v192" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-opacity="0.34"/>

  <!-- Roseta Acústica / Ostensório Dourado perfeitamente centrado no cruzamento (256, 188) -->
  <circle cx="256" cy="188" r="82" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-opacity="0.52"/>
  <circle cx="256" cy="188" r="64" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="8 8" stroke-opacity="0.45"/>

  <!-- Cordas de Violão / Lira Sacra -->
  <g stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.36" stroke-linecap="round">
    <line x1="234" y1="122" x2="234" y2="344"/>
    <line x1="256" y1="110" x2="256" y2="344"/>
    <line x1="278" y1="122" x2="278" y2="344"/>
  </g>

  <!-- Braço Horizontal da Cruz Litúrgica em Ouro (Simétrico em x=256) -->
  <rect x="146" y="174" width="220" height="28" rx="14" fill="url(#goldGrad)"/>
  <circle cx="146" cy="188" r="16" fill="url(#goldGrad)"/>
  <circle cx="366" cy="188" r="16" fill="url(#goldGrad)"/>

  <!-- Flâmula Musical / Chama Melódica Dourada (abaixo do braço direito, sem colisão) -->
  <path d="M268 232c52 12 88 46 90 92 2 24-8 44-22 56 4-22-4-48-26-64-13-10-26-15-42-18z" fill="url(#goldGrad)"/>

  <!-- Haste Vertical da Cruz + Colcheia Sacra em Marfim Luminoso (Centrada em x=256) -->
  <rect x="241" y="82" width="30" height="268" rx="15" fill="url(#ivoryGrad)"/>
  <circle cx="256" cy="82" r="17" fill="url(#goldGrad)"/>

  <!-- Cabeça da Nota Musical (Colcheia) na base da Haste -->
  <ellipse cx="212" cy="350" rx="60" ry="44" transform="rotate(-24 212 350)" fill="url(#ivoryGrad)"/>
  <ellipse cx="212" cy="350" rx="28" ry="17" transform="rotate(-24 212 350)" fill="#78151b"/>

  <!-- Base de Saltério / Pedestal Dourado -->
  <rect x="164" y="422" width="184" height="6" rx="3" fill="url(#goldGrad)" fill-opacity="0.75"/>
  <rect x="198" y="438" width="116" height="4" rx="2" fill="url(#goldGrad)" fill-opacity="0.45"/>
</svg>
